name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      nito_core_tag:
        description: 'Nito-core tag to build (e.g. v3.0.1)'
        required: true
        default: 'v3.0.1'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NITO_CORE_TAG=${{ github.event.inputs.nito_core_tag || 'v3.0.1' }}
          tags: |
            ghcr.io/nito-tools/docker-nito:${{ github.event.inputs.nito_core_tag || 'v3.0.1' }}
