name: Build and publish

# The Nito Core version comes from the ARG lines at the top of the
# Dockerfile, so there is one place to change it.
#
# Published images use Nito Core's official Linux release binaries
# (NITO_BUILD=release). Before building, scripts/verify-nito-core-release.sh
# checks the release's Minisign-signed SHA256SUMS, its GitHub build
# attestations and the checksums pinned in the Dockerfile. A manual run can
# choose NITO_BUILD=source instead, to check the compile-from-source option
# still works; those builds are never published.
#
# - Pull requests (and manual runs on any branch other than main) build
#   both architectures as a test, without publishing anything.
# - Pushes to main, and manual runs on main, build and publish to GHCR,
#   then create a GitHub Release. Each published build gets a number for
#   its Nito Core version: v4.0.0-1, v4.0.0-2, ... Those tags never
#   change. :v4.0.0 and :latest move to the newest build.
#
# Pull requests opened by check-nito-core.yml use GITHUB_TOKEN, which
# GitHub doesn't let trigger pull_request workflows, so that workflow
# starts this one with workflow_dispatch on the PR branch instead.
#
# Builds normally reuse cached layers, including the runtime stage's
# apt-get install, so a plain rebuild wouldn't pick up Debian security
# updates. Two ways round that:
# - Run it by hand with "Rebuild without cache" ticked.
# - Once a month the schedule checks the published image for Debian
#   package updates, and only if there are some rebuilds it without cache
#   and publishes the next build number. No updates, no new build, so
#   anything pinning by digest (the Umbrel app) isn't offered a pointless
#   update.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 5 3 * *'
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Rebuild without cache (picks up new Debian packages)'
        type: boolean
        default: false
      nito_build:
        description: 'Where nitod comes from: release (official binaries, published) or source (compile, about an hour; test only, never published)'
        type: choice
        options: [release, source]
        default: release

permissions:
  contents: write
  packages: write
  attestations: read

concurrency:
  group: build-${{ github.ref }}
  # Never cancel a publish half-way; test builds can be replaced.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/nito-tools/nito-docker

jobs:
  debian-updates:
    # Only the monthly schedule asks this; every other trigger skips it.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rebuild: ${{ steps.check.outputs.rebuild }}
      packages: ${{ steps.check.outputs.packages }}
    steps:
      - name: Check the published image for Debian package updates
        id: check
        run: |
          set -euo pipefail
          # Both architectures install the same packages, so amd64 is enough.
          upgradable="$(docker run --rm --platform linux/amd64 --pull always --entrypoint sh "$IMAGE:latest" \
            -c 'apt-get update -qq >/dev/null && apt list --upgradable 2>/dev/null' \
            | grep -v '^Listing' || true)"
          if [ -n "$upgradable" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            {
              echo "packages<<EOF"
              printf '%s\n' "$upgradable"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            {
              echo "Debian updates waiting in $IMAGE:latest, rebuilding:"
              echo '```'
              printf '%s\n' "$upgradable"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "No Debian updates waiting in $IMAGE:latest, nothing to rebuild." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: debian-updates
    # Runs for every trigger except a monthly check that found no updates.
    # always() because a skipped needs-job would otherwise skip this too.
    if: always() && (needs.debian-updates.result == 'skipped' || needs.debian-updates.outputs.rebuild == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version
        id: version
        env:
          NITO_BUILD_INPUT: ${{ inputs.nito_build }}
        run: |
          set -euo pipefail
          tag="$(sed -n 's/^ARG NITO_CORE_TAG=//p' Dockerfile)"
          commit="$(sed -n 's/^ARG NITO_CORE_COMMIT=//p' Dockerfile)"
          if [ -z "$tag" ] || [ -z "$commit" ]; then
            echo "::error::Couldn't read NITO_CORE_TAG and NITO_CORE_COMMIT from the Dockerfile"
            exit 1
          fi
          build="${NITO_BUILD_INPUT:-release}"
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$build" = "release" ]; then
            publish=true
          else
            publish=false
          fi

          # Next build number for this Nito Core version: one more than the
          # highest already used, looking at both Git tags and image tags,
          # so a run that pushed an image but failed to create its release
          # never has its number reused.
          git_tags="$(git ls-remote --tags --refs origin "refs/tags/$tag-*" | sed 's|.*refs/tags/||')"
          # GHCR refuses an anonymous token (403) for a package that doesn't
          # exist yet (or isn't public), so before the first publish there
          # are no image tags to count; the Git tags still are.
          image_tags=""
          if token="$(curl -fsS "https://ghcr.io/token?scope=repository:${IMAGE#ghcr.io/}:pull" | jq -er .token)"; then
            image_tags="$(curl -fsS -H "Authorization: Bearer $token" "https://${IMAGE%%/*}/v2/${IMAGE#ghcr.io/}/tags/list" | jq -r '.tags[]?' || true)"
          else
            echo "::warning::Couldn't read the tags of $IMAGE (not published yet, or not public); numbering from Git tags only."
          fi
          last="$(printf '%s\n%s\n' "$git_tags" "$image_tags" \
            | sed -n "s/^$(printf '%s' "$tag" | sed 's/\./\\./g')-\([0-9][0-9]*\)$/\1/p" \
            | sort -n | tail -1)"
          version="$tag-$(( ${last:-0} + 1 ))"

          {
            echo "tag=$tag"
            echo "commit=$commit"
            echo "version=$version"
            echo "publish=$publish"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Nito Core $tag (\`$commit\`), NITO_BUILD=$build"
            if [ "$publish" = "true" ]; then
              echo
              echo "Publishing as **$version**, \`:$tag\` and \`:latest\`."
            else
              echo
              echo "Test build only, not published (would be $version)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Nito Core's release files
        if: steps.version.outputs.build == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign >/dev/null
          amd64="$(sed -n 's/^ARG NITO_CORE_SHA256_AMD64=//p' Dockerfile)"
          arm64="$(sed -n 's/^ARG NITO_CORE_SHA256_ARM64=//p' Dockerfile)"
          scripts/verify-nito-core-release.sh "$TAG" "$amd64" "$arm64"
          echo "Release files verified: Minisign signature, SHA256SUMS, build attestations, pinned checksums." >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: steps.version.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ steps.version.outputs.publish == 'true' && ' and push' || ' (test only, not published)' }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.version.outputs.publish == 'true' }}
          # The fresh layers are still saved to the cache for later builds.
          no-cache: ${{ github.event_name == 'schedule' || inputs.no_cache == true }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NITO_BUILD=${{ steps.version.outputs.build }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:latest
          # Labels go on each architecture's image (docker inspect shows
          # them); annotations on the multi-arch index, which is what GHCR
          # reads to link the package to this repo and show a description.
          labels: |
            org.opencontainers.image.title=nito-docker
            org.opencontainers.image.description=Nito full node (nitod and nito-cli) from Nito Core's verified release binaries
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            network.nito.core.version=${{ steps.version.outputs.tag }}
            network.nito.core.commit=${{ steps.version.outputs.commit }}
          annotations: |
            index:org.opencontainers.image.title=nito-docker
            index:org.opencontainers.image.description=Nito full node (nitod and nito-cli) from Nito Core's verified release binaries
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Create the GitHub Release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ steps.version.outputs.commit }}
          DIGEST: ${{ steps.build.outputs.digest }}
          NO_CACHE: ${{ github.event_name == 'schedule' || inputs.no_cache == true }}
          DEBIAN_UPDATES: ${{ needs.debian-updates.outputs.packages }}
        run: |
          set -euo pipefail
          {
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              echo "Monthly rebuild to pick up Debian package updates. Nito Core is unchanged."
              echo
              echo '```'
              printf '%s\n' "$DEBIAN_UPDATES"
              echo '```'
              echo
            elif [ "$NO_CACHE" = "true" ]; then
              echo "Rebuilt without cache (started by hand), picking up the latest Debian packages."
              echo
            fi
            echo "Nito Core **$TAG** ([release notes](https://github.com/NitoNetwork/Nito-core/releases/tag/$TAG), commit \`$COMMIT\`), for linux/amd64 and linux/arm64, using Nito Core's official release binaries. Checked before building: the Minisign signature on SHA256SUMS, the GitHub build attestations (Nito Core's build-release.yml) and the checksums pinned in the Dockerfile."
            echo
            echo '```'
            echo "docker pull $IMAGE:$VERSION"
            echo '```'
            echo
            echo "- Image digest: \`$DIGEST\`"
            echo "- Also tagged \`:$TAG\` and \`:latest\` (until a newer build)."
            echo "- Pin exactly: \`$IMAGE:$VERSION@$DIGEST\`"
          } > release-notes.md
          # --generate-notes adds the pull requests and commits since the
          # previous release below this.
          gh release create "$VERSION" --target "$GITHUB_SHA" \
            --title "$VERSION" --notes-file release-notes.md --generate-notes
